# yaml-language-server: $schema=https://www.schemastore.org/dependabot-2.0.json
---
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    allow:
      - dependency-type: all
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    allow:
      - dependency-type: all
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        patterns:
          - "*"

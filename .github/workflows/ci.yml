name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the gh-pages branch
      pages: read # wait for the Pages build
    concurrency:
      group: pages
      cancel-in-progress: false
    outputs:
      url: ${{ steps.pages.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      # GitHub Pages serves the gh-pages branch, so publish site/ there as a single commit.
      - name: Publish site/ to the gh-pages branch
        id: publish
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          touch site/.nojekyll
          git add site/.nojekyll
          sha=$(git commit-tree "$(git write-tree --prefix=site/)" -m "Deploy $GITHUB_SHA")
          git push --force origin "$sha:refs/heads/gh-pages"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Wait for the Pages build
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.publish.outputs.sha }}
        run: |
          for _ in $(seq 60); do
            build=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq '"\(.commit) \(.status)"' || true)
            [ "$build" = "$SHA built" ] && break
            [ "$build" = "$SHA errored" ] && { echo "::error::The GitHub Pages build failed"; exit 1; }
            sleep 5
          done
          [ "$build" = "$SHA built" ] || { echo "::error::Timed out waiting for the GitHub Pages build"; exit 1; }
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          url="https://${url#*://}"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to <$url>" >> "$GITHUB_STEP_SUMMARY"

  live:
    name: Live check
    needs: deploy
    permissions:
      contents: read
      pages: read
    uses: ./.github/workflows/live-check.yml
    with:
      url: ${{ needs.deploy.outputs.url }}

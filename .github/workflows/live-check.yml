name: Live check

# Runs the live smoke tests against the deployed page, so CORS is verified from the real origin.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: URL of the page to test
        required: false
        default: https://dariuszporowski.github.io/startup-name-checker/

permissions:
  contents: read

jobs:
  live:
    name: Live check
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:live
        env:
          LIVE_URL: ${{ inputs.url || 'https://dariuszporowski.github.io/startup-name-checker/' }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

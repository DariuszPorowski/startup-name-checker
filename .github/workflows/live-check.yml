name: Live check

# Runs the live smoke tests against the deployed page, so CORS is verified from the real origin.
# CI calls it after every deployment. You can also run it manually.
on:
  workflow_call:
    inputs:
      url:
        description: URL of the page to test
        type: string
        required: false
  workflow_dispatch:
    inputs:
      url:
        description: URL of the page to test (defaults to the GitHub Pages URL)
        required: false

permissions:
  contents: read
  pages: read

jobs:
  live:
    name: Live check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolve the page URL
        id: url
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ inputs.url }}
        run: |
          if [ -z "$URL" ]; then
            URL=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
            URL="https://${URL#*://}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - run: npm run test:live
        env:
          LIVE_URL: ${{ steps.url.outputs.url }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

name: Live check

# Runs the live smoke tests against the deployed page, so CORS is verified from the real origin.
# CI calls it after every deployment. You can also run it manually.
on:
  workflow_call:
    inputs:
      url:
        description: URL of the page to test
        type: string
        required: false
  workflow_dispatch:
    inputs:
      url:
        description: URL of the page to test (defaults to the GitHub Pages URL)
        required: false

permissions:
  contents: read
  pages: read

jobs:
  live:
    name: Live check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolve the page URL
        id: url
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ inputs.url }}
        run: |
          if [ -z "$URL" ]; then
            URL=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
            URL="https://${URL#*://}"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - run: npm run test:live
        env:
          LIVE_URL: ${{ steps.url.outputs.url }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
